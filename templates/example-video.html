<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <!-- render-video.mjs reads the format from here -->
  <meta name="video" content="width=1920, height=1080, fps=30, duration=9">
  <link rel="stylesheet" href="../brand/tokens.css">
  <link rel="stylesheet" href="base.css">
  <style>.frame { --k: 1.4; padding: 140px; }</style>
</head>
<body>
  <div class="stage">
    <section class="scene" style="--start: 0s; --dur: 3s">
      <div class="frame dark center">
        <div class="eyebrow in" style="--d: 0.1s">Scene 1 · 0–3 s</div>
        <h1 class="h1 in" style="--d: 0.3s">The hook, on screen <span class="mark">in the first second</span>.</h1>
      </div>
    </section>
    <section class="scene" style="--start: 3s; --dur: 3s">
      <div class="frame dark center">
        <h2 class="h2 in left" style="--d: 0.1s">Each scene is a section with a start and a length.</h2>
        <p class="lead in" style="--d: 0.6s">Animations are plain CSS. The renderer steps through time frame by frame.</p>
      </div>
    </section>
    <section class="scene hold-end" style="--start: 6s; --dur: 3s">
      <div class="frame brand center">
        <h2 class="h1 in pop" style="--d: 0.1s">One call to action.</h2>
        <p class="lead in" style="--d: 0.5s; color: var(--paper)">yourbrand.com</p>
      </div>
    </section>
  </div>
</body>
</html>
